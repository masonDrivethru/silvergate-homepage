<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SilverBio Compare — JSON 으로 표를 그리는 컴포넌트 + 고유 ID</title>
<style>
  body { margin: 0; font: 14px/1.6 system-ui, sans-serif; background: #f4f5f7; color: #1f2328; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  .doc { background: #fff; padding: 20px 24px; margin: 12px; border: 1px solid #e3e5e8; }
  .doc table { border-collapse: collapse; width: 100%; }
  .doc th, .doc td { border: 1px solid #cfd3d8; padding: 4px 8px; text-align: center; }
  .doc th { background: #f1f3f5; }
  .doc h4 { margin: 14px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:18px">JSON 으로 표를 그리는 컴포넌트 (블록 쌓기 · 조건부 칸 합침 · 실행 데이터만큼 반복) + 고유 ID</h1>
  <p>표 컴포넌트는 바닐라 JS 입니다. 비교 모듈을 위해 한 일은 <b>★ 표시한 두 줄</b>(고유 ID 달기)뿐입니다. 없어도 동작하지만, 있으면 똑같이 생긴 표·줄이 반복되거나 순서가 바뀌어도 정확히 짝지어집니다.</p>
  <div id="viewer"></div>
</div>

<script src="../../dist/sg-compare.min.js"></script>
<script>
  /**
   * 표 컴포넌트 (고객사 코드 자리).
   *   model.bricks = 기준정보 목록 — 하나가 블록(줄) 하나
   *   model.runs   = 실행 데이터 — 하나마다 표 하나를 반복해서 그림
   */
  function drawSheet(host, model) {
    host.replaceChildren();
    model.runs.forEach(function (run) {
      // ★ 1) 실행(표) 하나를 한 묶음으로 감싸고 실행 ID 를 단다 → 표가 가운데 끼어들어도 같은 실행끼리 짝지음
      var box = document.createElement('section');
      box.setAttribute('data-sgc-key', run.id);

      var cap = document.createElement('h4'); cap.textContent = run.title;
      var t = document.createElement('table'), hr = t.createTHead().insertRow();
      ['구분', '시험 항목', '기준', '결과', '판정'].forEach(function (x) { var th = document.createElement('th'); th.textContent = x; hr.appendChild(th); });
      var body = t.createTBody(), last = null, lastCell = null;

      model.bricks.forEach(function (b) {
        var tr = body.insertRow(), v = run.values[b.id];
        // ★ 2) 줄마다 기준정보 ID 를 단다 → 줄 순서가 바뀌면 "이동", 가운데 끼면 "추가"로 정확히
        tr.setAttribute('data-sgc-key', b.id);

        if (b.group === last && lastCell) lastCell.rowSpan += 1;        // 같은 구분이 이어지면 세로로 합침
        else { lastCell = tr.insertCell(); lastCell.textContent = b.group; last = b.group; }
        tr.insertCell().textContent = b.item;
        if (v === undefined || v === null) {                            // 조건: 값이 없으면 세 칸을 하나로
          var c = tr.insertCell(); c.colSpan = 3; c.textContent = '해당 없음';
        } else {
          tr.insertCell().textContent = b.spec; tr.insertCell().textContent = v; tr.insertCell().textContent = '적합';
        }
      });
      box.append(cap, t);
      host.appendChild(box);
    });
  }

  // 서버에서 받은 JSON (예시)
  var bricks1 = [
    { id: 'look',  group: '물리', item: '성상',     spec: '흰색 분말' },
    { id: 'water', group: '물리', item: '수분',     spec: '2.0% 이하' },
    { id: 'assay', group: '화학', item: '함량',     spec: '98.0 ~ 102.0%' },
    { id: 'imp',   group: '화학', item: '유연물질', spec: '0.5% 이하' } ];
  var before = { bricks: bricks1, runs: [
    { id: 'RUN-001', title: '시험 결과', values: { look: '흰색 분말', water: '1.2%', assay: '99.6%', imp: '0.1%' } },
    { id: 'RUN-002', title: '시험 결과', values: { look: '흰색 분말', water: '1.3%', assay: '99.4%', imp: '0.1%' } } ] };

  var bricks2 = bricks1.slice();
  bricks2.splice(2, 0, { id: 'size', group: '물리', item: '입도', spec: '90% 이상' });     // 기준정보 추가
  var after = { bricks: bricks2, runs: [
    before.runs[0],
    { id: 'RUN-001R', title: '시험 결과', values: { look: '흰색 분말', water: '1.3%', size: '95%', assay: '99.3%', imp: null } },   // 끼어든 실행
    { id: 'RUN-002',  title: '시험 결과', values: { look: '흰색 분말', water: '1.3%', size: '93%', assay: '99.7%', imp: '0.1%' } } ] };
  after.runs[0] = { id: 'RUN-001', title: '시험 결과', values: { look: '흰색 분말', water: '1.2%', size: '94%', assay: '99.6%', imp: '0.1%' } };

  // 비교 화면
  var lay = SgCompare.mountLayout(document.getElementById('viewer'), { leftLabel: '이전', rightLabel: '새 버전', locale: 'ko', height: '80vh' });
  lay.left.innerHTML = '<div class="doc"><div class="grid"></div></div>';
  lay.right.innerHTML = '<div class="doc"><div class="grid"></div></div>';
  var ctrl = SgCompare.createCompare({
    left: lay.left, right: lay.right, leftScroller: lay.desk, rightScroller: lay.desk,
    watch: true,      // 컴포넌트가 표를 다시 그리면 자동으로 다시 비교
    locale: 'ko'
  });
  lay.attach(ctrl);

  // 표는 나중에 그려져도 된다 (JSON 이 도착한 뒤)
  drawSheet(lay.left.querySelector('.grid'), before);
  drawSheet(lay.right.querySelector('.grid'), after);
</script>
</body>
</html>
